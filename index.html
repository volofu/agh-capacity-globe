<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090A0C" />
    <title>AGH Cloud Capacity Globe</title>
    <meta name="description" content="Live GPU and CPU capacity across AGH Cloud and partner locations, on an interactive globe." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23532589'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23d7c39a' stroke-width='2'/%3E%3Cpath d='M7 16h18M16 7c4 4 4 14 0 18M16 7c-4 4-4 14 0 18' fill='none' stroke='%23d7c39a' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <button id="filtersToggle" class="pill-btn" type="button" aria-controls="filters" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 4h12M4 8h8M6 12h4"/></svg>
        Filters
      </button>

      <aside id="filters" aria-label="Filters"></aside>

      <main id="stage">
        <div id="globe" aria-label="Interactive globe of available capacity"></div>

        <div id="topbar">
          <button id="backBtn" class="pill-btn" type="button" hidden>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
            Back to globe
          </button>
          <div id="rotateWrap" class="rotate">
            <span id="rotateLabel">Auto-rotate</span>
            <button id="rotateBtn" type="button" class="switch" aria-pressed="true" aria-labelledby="rotateLabel"><span></span></button>
          </div>
        </div>

        <div id="flagsWrap">
          <span id="flagsCaption" class="caption">Jump to a country</span>
          <div id="flags" role="group" aria-label="Countries with capacity"></div>
        </div>

        <div id="updated" class="updated"></div>
        <div id="status" class="status" role="status"></div>
      </main>

      <section id="detail" aria-label="Location details" hidden></section>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
