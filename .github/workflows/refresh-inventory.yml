name: Refresh inventory

on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Fetch live inventory
        env:
          AGH_COOKIE: ${{ secrets.AGH_COOKIE }}
        run: node scripts/fetch-inventory.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/inventory.json; then
            echo "No change."
          else
            git config user.name "inventory-bot"
            git config user.email "inventory-bot@users.noreply.github.com"
            git add data/inventory.json
            git commit -m "chore(data): refresh inventory $(date -u +%F)"
            git push
          fi
